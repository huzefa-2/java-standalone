apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-webapp
  namespace: java-webapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-webapp

  template:
    metadata:
      labels:
        app: java-webapp

    spec:
      containers:
        - name: java-webapp

          image: 177203142049.dkr.ecr.us-east-1.amazonaws.com/java-webapp:PLACEHOLDER

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
